<table class="table table-warning">
    <thead>
        <tr>
            <th>Numero</th>
            <th>Nombre</th>
            <th>Localidad</th>
        </tr>
    </thead>
    <tbody>
        @for (dept of departamentos; track dept){
        <tr>
            <td>{{dept.numero}}</td>
            <td>{{dept.nombre}}</td>
            <td>{{dept.localidad}}</td>
            <td>
                <!-- <a [routerLink]="['/details/'+ 
                dept.numero + 
                '/' + dept.nombre + 
                '/' + dept.localidad]"></a> -->
                <!-- Otra forma de hacerlo es: -->
                <a [routerLink]="['/details', dept.numero, dept.nombre, dept.localidad,]" class="btn btn-info">
                    Details
                </a>
                <a [routerLink]="['/update', dept.numero]" class="btn btn-info">
                    Edit
                </a>
                <button class="btn btn-danger" (click)="deleteDepartamento(dept.numero)">
                    Delete
                </button>
            </td>
        </tr>
        }
    </tbody>
</table>
